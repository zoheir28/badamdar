<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آفلاین</title>
<style>
  body{font-family:Tahoma,Arial,sans-serif;background:#f4f7f4;color:#1b2b1b;margin:0;padding:24px;text-align:center}
  .card{max-width:420px;margin:12vh auto 0;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 10px;color:#07584f}
  p{line-height:1.9;margin:8px 0;font-size:15px}
  button{margin-top:18px;background:#07584f;color:#fff;border:0;border-radius:10px;padding:12px 26px;font-size:16px}
</style>
</head>
<body>
<div class="card">
  <h1>اتصال اینترنت برقرار نیست</h1>
  <p>این صفحه هنوز در حالت آفلاین ذخیره نشده است. صفحاتی که قبلاً با اینترنت باز کرده‌اید بدون اینترنت هم باز می‌شوند.</p>
  <p>فرم‌هایی که در حالت آفلاین ثبت کرده باشید ذخیره می‌مانند و به‌محض اتصال اینترنت خودکار ارسال می‌شوند.</p>
  <button onclick="location.reload()">تلاش دوباره</button>
</div>
</body>
</html>
